<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="NEX">
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3a4658"/>
      <stop offset=".35" stop-color="#141b26"/>
      <stop offset=".8" stop-color="#05080d"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#1677ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#5a6779"/>
      <stop offset=".45" stop-color="#151c27"/>
      <stop offset="1" stop-color="#020407"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset=".35" stop-color="#2fd2ff"/>
      <stop offset="1" stop-color="#05324f"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset=".5" stop-color="#6c7a8d"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".9" fill="#0a4a63" opacity=".55"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="sphere"><circle cx="205" cy="215" r="140"/></clipPath>
  </defs>

  <!-- halo and back half of the orbit ring -->
  <circle cx="205" cy="215" r="172" fill="url(#halo)"/>
  <ellipse cx="205" cy="232" rx="188" ry="46" transform="rotate(-9 205 232)" fill="none" stroke="#2c8fff" stroke-width="4" opacity=".55" filter="url(#glow)"/>

  <!-- antenna -->
  <path d="M136 98 L118 60" stroke="url(#stem)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="111" cy="42" r="23" fill="url(#ball)" stroke="#2a3646" stroke-width="1.5"/>
  <circle cx="104" cy="40" r="5.5" fill="#43c8ff" filter="url(#glow)"/>
  <path d="M90 46 Q111 52 132 40" fill="none" stroke="#2c8fff" stroke-width="1.2" opacity=".7"/>

  <!-- body -->
  <circle cx="205" cy="215" r="140" fill="url(#body)"/>
  <g clip-path="url(#sphere)" fill="none" stroke="#56657a" stroke-width="2" opacity=".55">
    <path d="M70 160 Q205 110 340 160"/>
    <path d="M66 270 Q205 330 345 262"/>
    <path d="M150 78 Q118 215 160 352"/>
    <path d="M258 80 Q300 120 318 150"/>
    <path d="M110 120 L150 132 L190 112 L235 118 L270 100"/>
    <path d="M118 318 L160 300 L205 312 L250 300 L292 312"/>
    <path d="M180 92 Q205 86 230 94" stroke-width="6" stroke="#0a0e14" opacity="1"/>
  </g>
  <ellipse cx="160" cy="135" rx="60" ry="30" transform="rotate(-25 160 135)" fill="#ffffff" opacity=".07"/>
  <path d="M110 128 Q140 98 182 88" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".22" filter="url(#soft)"/>
  <circle cx="205" cy="215" r="139" fill="none" stroke="#1f8fff" stroke-width="3" opacity=".75" filter="url(#glow)"/>
  <circle cx="148" cy="104" r="3" fill="#43c8ff" filter="url(#glow)"/>

  <!-- side lens -->
  <g transform="translate(98 232)">
    <circle r="44" fill="#0c121a" stroke="#6f7f93" stroke-width="3"/>
    <circle r="36" fill="#05080d" stroke="#2b3644" stroke-width="5"/>
    <circle r="24" fill="url(#lens)" opacity=".9" filter="url(#glow)"/>
    <circle r="14" fill="#06263b" opacity=".75"/>
    <circle cx="-6" cy="-7" r="5" fill="#e9fdff" opacity=".85"/>
    <path d="M47 -18 v10 M47 0 v10" stroke="#8796a8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- visor and eyes -->
  <rect x="186" y="146" width="148" height="122" rx="58" fill="#02050b"/>
  <rect x="186" y="146" width="148" height="122" rx="58" fill="none" stroke="#3db2ff" stroke-width="5" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <path d="M226 228 V196 A15 15 0 0 1 256 196 V228 H248 A7 9 0 0 0 234 228 Z" fill="#5ee8ff"/>
    <path d="M276 228 V196 A15 15 0 0 1 306 196 V228 H298 A7 9 0 0 0 284 228 Z" fill="#5ee8ff"/>
  </g>
  <path d="M226 228 V196 A15 15 0 0 1 256 196 V228 H248 A7 9 0 0 0 234 228 Z M276 228 V196 A15 15 0 0 1 306 196 V228 H298 A7 9 0 0 0 284 228 Z" fill="url(#dots)"/>

  <!-- status lights -->
  <g fill="#2c9bff" filter="url(#glow)">
    <rect x="186" y="312" width="7" height="4" rx="1"/>
    <rect x="198" y="314" width="7" height="4" rx="1"/>
    <rect x="236" y="296" width="5" height="5" rx="1"/>
  </g>

  <!-- front half of the orbit ring -->
  <path d="M17 232 A188 46 0 0 0 393 232" transform="rotate(-9 205 232)" fill="none" stroke="#7fd4ff" stroke-width="4" filter="url(#glow)"/>
</svg>
